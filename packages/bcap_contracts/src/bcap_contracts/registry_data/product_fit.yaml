# Product→gap fit map (ADR-0039, GRS-0162) — which registry gaps each represented product
# addresses. Authored commercial judgment from the product-course research, kept as DATA so the
# sell-from-report join never string-matches course prose. Validated at load (fail loud,
# ADR-0001): every product here must exist in commissions.yaml, every key must exist in the
# registry, and EVERY catalogue product must appear here — an empty fit is an explicit decision.
#
# `profiles` (GRS-0169): the operating models a product is actually sellable into. The current
# catalogue is retail-brokerage tooling — recommending a logo API to an exchange or a ticker-news
# feed to a wealth manager "would get laughed out of the room" (staging personas, 3/5). A product
# only surfaces for assessments scored under a listed profile; wealth/exchange get an honest
# "catalogue doesn't cover this segment yet" instead.
version: product-fit-v2

products:
  openbb:
    profiles: [retail]
    # Research/data workspace + API — the course ties it to "a research/tooling infrastructure
    # gap" a Platform Power read surfaces.
    modules: [MARKET_DATA]
    c_modules: [CUST_RESEARCH_EDUCATION]
    powers: []
    pitch: >-
      OpenBB's research workspace closes a market-data / research-tooling infrastructure gap and
      lifts the research & education side of the customer proposition.
  benzinga:
    profiles: [retail]
    # News / ratings / signals content — the course ties it to "a market-content / engagement
    # gap: news, ratings and signals to enrich ticker pages".
    modules: [MARKET_DATA]
    c_modules: [CUST_RESEARCH_EDUCATION]
    powers: []
    pitch: >-
      An always-fresh Benzinga news / ratings / signals feed answers a market-content and
      engagement gap — enriched ticker pages and research surfaces that keep clients in-app.
  # The two Brandfetch licences serve different segments and must never be offered to the wrong
  # one (GRS-0185). Distribution is about the client's OWN app looking right; redistribution is
  # about licensing brand data onward to the client's customers. They carried identical stanzas,
  # so a retail report could be sold either.
  brandfetch_distribution:
    profiles: [retail]
    # Brand-asset API (distribution licence) — brand consistency across the client's own surfaces.
    modules: [CMS, FRONTEND]
    c_modules: [CUST_UI_NAVIGATION]
    powers: [BRANDING]
    pitch: >-
      Brandfetch's brand API renders logos and brand assets inside your own app, so every
      instrument and merchant surface stays on-brand. It addresses the content-management and
      front-end gaps that make a retail interface look cheaper than the platform behind it.
  brandfetch_redistribution:
    # Exchanges and information vendors only. An information-vendor profile does not exist in the
    # registry yet and the loader refuses an unknown one, so this stays [exchange] until that
    # profile is added, at which point it becomes [exchange, information_vendor].
    profiles: [exchange]
    # No c_modules: CUST_UI_NAVIGATION is a retail customer-navigation module and does not
    # describe a venue redistributing data. The fit targets differ, not just the prose, so this
    # variant is matched against a venue's real gaps rather than a retail one's.
    modules: [CMS, FRONTEND]
    powers: [BRANDING]
    pitch: >-
      A redistribution licence lets you serve Brandfetch's brand data onward to your own
      customers, as part of the reference data your venue already distributes. This is a
      data-licensing capability, not app chrome.

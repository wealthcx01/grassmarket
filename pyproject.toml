[project]
name = "grassmarket"
version = "0.0.1"
description = "Grassmarket — Bruntsfield Advisor Studio: the advisor platform for the Bruntsfield Advisory Network (pipeline, ATLAS assessment engine, deliverables, earnings, Workbench)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # Shared contracts (local workspace package) — the future Holy Corner API surface.
    "bcap-contracts",
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    # Persistence
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    # Contracts / config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "python-dotenv>=1.0",
    # Auth
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    # httpx is a RUNTIME dependency: auth/google_oauth.py imports it at module load (the OAuth token
    # exchange), which is on the app-import path (web/app.py). It was previously dev-only, so the prod
    # build (`uv sync --no-dev`) crashed on boot with ModuleNotFoundError. Must stay in runtime deps.
    "httpx>=0.27",
    "python-docx>=1.1",
    "matplotlib>=3.11.0",
    "cryptography>=49.0.0",
    # Client report PDF (GRS-0219). Pure-Python wheel with NO system dependencies — deliberate:
    # WeasyPrint would render the design system's CSS directly but needs pango/cairo installed in
    # the Railway image, and a headless-Chromium print path needs a ~300MB browser in the container.
    # reportlab's Platypus gives page templates (running heads, folios), tables that repeat their
    # headers across a page break, and canvas-level drawing for the cover and the watermark.
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pyright>=1.1",
    "pre-commit>=3.7",
    # Golden-master workbook authoring (GRS-0003): live-formula xlsx + JSON export.
    "openpyxl>=3.1.5",
    # Reading back the PDFs we generate, so the golden-master render test asserts on extracted text
    # rather than on bytes (GRS-0219). Test-only: nothing in the app reads a PDF.
    "pypdf>=5.0",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
bcap-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grassmarket"]

# --- Tool config: copied verbatim from C:\dev\SD3\pyproject.toml (SD3 engineering standard) ---

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

# One generated family, one rule. `*_diagrams.py` under `workbench/content` is written by
# `design/motion/svg_export.py` and holds one SVG element per line; wrapping those would make a
# diagram's diff unreadable, which is the whole reason it is emitted element-per-line. The glob
# covers a course per file (openbb, benzinga, ...) rather than needing an entry per course, which
# is the kind of edit that gets forgotten. Nothing hand-written is exempt.
[tool.ruff.lint.per-file-ignores]
"src/grassmarket/workbench/content/*_diagrams.py" = ["E501"]

# FastAPI's dependency-injection idiom puts calls (Depends/Security/…) in argument defaults; they
# are immutable sentinels by design, so B008 does not apply. (SD3 has no FastAPI; this is the one
# additive rule for a web app.)
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.pyright]
include = ["src", "packages"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

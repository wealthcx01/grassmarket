<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600"><g transform="translate(560,300)"><rect x="-560" y="-300" width="1120" height="600" fill="#F7F5EF"/></g><text x="560" y="530" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">Doubling your reach rate does as much as doubling your win rate.</text><g transform="translate(560,424)"><rect x="-310" y="-48" width="620" height="96" rx="14" fill="#F7F5EF" stroke="#A3502A" stroke-width="2"/></g><text x="560" y="448" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Millions in cost, contracts in years. Absorb it and you have raised the odds.</text><text x="560" y="412" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" fill="#A3502A" text-anchor="middle" dominant-baseline="central">The incumbent's switching cost</text><text x="560" y="356" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="1.4" fill="#A3502A" text-anchor="middle" dominant-baseline="central">LOWERS IT</text><g transform="translate(920,240)"><rect x="-82" y="-66" width="164" height="132" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><text x="920" y="278" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">the committee</text><text x="920" y="254" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">agreement across</text><text x="920" y="216" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Consensus</text><g transform="translate(740,240)"><rect x="-82" y="-66" width="164" height="132" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><text x="740" y="278" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">you can show</text><text x="740" y="254" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">fidelity of what</text><text x="740" y="216" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Proof</text><g transform="translate(560,240)"><rect x="-82" y="-66" width="164" height="132" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><text x="560" y="278" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">your thesis</text><text x="560" y="254" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">differentiation of</text><text x="560" y="216" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Insight</text><g transform="translate(380,240)"><rect x="-82" y="-66" width="164" height="132" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><text x="380" y="278" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">economic buyer</text><text x="380" y="254" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">access to the</text><text x="380" y="216" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Reach</text><g transform="translate(200,240)"><rect x="-82" y="-66" width="164" height="132" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><text x="200" y="278" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">you are riding</text><text x="200" y="254" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">the dated catalyst</text><text x="200" y="216" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Trigger</text><text x="560" y="140" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="1.4" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">RAISES WIN PROBABILITY</text><text x="560" y="84" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Every variable is a lever, not a given. Diagnose which term is dragging.</text><text x="560" y="46" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="27" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Win probability is five levers and one drag</text></svg>

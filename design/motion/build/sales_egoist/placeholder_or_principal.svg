<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600"><g transform="translate(560,300)"><rect x="-560" y="-300" width="1120" height="600" fill="#F7F5EF"/></g><g transform="translate(820,324)"><rect x="-230" y="-165" width="460" height="330" rx="14" fill="#1A3B26"/></g><g transform="translate(300,324)"><rect x="-230" y="-165" width="460" height="330" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><text x="560" y="548" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">A seller who waits becomes a placeholder. Interchangeable, and easily replaced.</text><text x="820" y="452" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">Is irreplaceable</text><text x="300" y="452" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Is interchangeable</text><text x="820" y="388" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">Sets the timeline</text><text x="300" y="388" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Moves on the buyer's timeline</text><text x="820" y="324" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">Reports territory taken</text><text x="300" y="324" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Reports activity</text><text x="820" y="260" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">Turns trust into real leverage</text><text x="300" y="260" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Hopes relationships mature</text><text x="820" y="196" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">Engineers the reason to engage</text><text x="300" y="196" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Waits for inbound and RFPs</text><text x="820" y="122" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" letter-spacing="1.5" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">THE PRINCIPAL</text><text x="300" y="122" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" letter-spacing="1.5" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">THE PLACEHOLDER</text><text x="560" y="48" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="28" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">The same five situations, answered two ways</text></svg>

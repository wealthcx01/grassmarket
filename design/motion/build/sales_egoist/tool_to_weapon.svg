<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500"><g transform="translate(560,250)"><rect x="-560" y="-250" width="1120" height="500" fill="#F7F5EF"/></g><g transform="translate(890,250)"><rect x="-130" y="-95" width="260" height="190" rx="14" fill="#1A3B26"/></g><g transform="translate(560,250)"><rect x="-130" y="-95" width="260" height="190" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(230,250)"><rect x="-130" y="-95" width="260" height="190" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(702,240)"><rect x="-18.5" y="-1.25" width="37" height="2.5" fill="#6E6A60"/></g><g transform="translate(725,240) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(372,240)"><rect x="-18.5" y="-1.25" width="37" height="2.5" fill="#6E6A60"/></g><g transform="translate(395,240) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><text x="560" y="456" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="1.4" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">A FORMULA, NOT A FEATURE LIST</text><text x="560" y="416" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">When I do X to buyer Y, I produce outcome Z.</text><text x="890" y="296" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">when and how it wins.</text><text x="890" y="272" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">The repeatable equation for</text><text x="890" y="224" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="22" letter-spacing="1.6" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">FORMULA</text><text x="890" y="178" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">03</text><text x="560" y="296" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">deliberately as your one edge.</text><text x="560" y="272" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">That tool, chosen</text><text x="560" y="224" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="22" letter-spacing="1.6" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">WEAPON</text><text x="560" y="178" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">02</text><text x="230" y="296" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">happen to know.</text><text x="230" y="272" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">A methodology you</text><text x="230" y="224" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="22" letter-spacing="1.6" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">TOOL</text><text x="230" y="178" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">01</text><text x="560" y="88" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">A method becomes a weapon only when you define the formula for how it strikes.</text><text x="560" y="48" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="30" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">A tool is not a weapon</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500"><g transform="translate(560,250)"><rect x="-560" y="-250" width="1120" height="500" fill="#F7F5EF"/></g><text x="560" y="448" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">The incumbent outage in a bursty session. Position as though it is a when.</text><text x="560" y="410" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" letter-spacing="1.4" fill="#A3502A" text-anchor="middle" dominant-baseline="central">UNDATED, AND INEVITABLE</text><g transform="translate(560,320)"><rect x="-450" y="-1.5" width="900" height="3" fill="#D8D3C7"/></g><g transform="translate(930,320)"><rect x="-8" y="-8" width="16" height="16" rx="8" fill="#1A3B26"/></g><text x="930" y="294" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">move to T+1</text><text x="930" y="268" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">UK, EU and Switzerland</text><text x="930" y="214" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="18" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">11 Oct 2027</text><g transform="translate(630,320)"><rect x="-8" y="-8" width="16" height="16" rx="8" fill="#1A3B26"/></g><text x="630" y="294" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">confirmations mandated</text><text x="630" y="268" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">T+0 allocations and</text><text x="630" y="214" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="18" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">Dec 2026</text><g transform="translate(390,320)"><rect x="-8" y="-8" width="16" height="16" rx="8" fill="#1A1A18"/></g><text x="390" y="294" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">begin to bite</text><text x="390" y="268" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">EU AI Act obligations</text><text x="390" y="214" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="18" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Aug 2026</text><g transform="translate(150,320)"><rect x="-8" y="-8" width="16" height="16" rx="8" fill="#6E6A60"/></g><text x="150" y="268" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">US moves to T+1</text><text x="150" y="214" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="18" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">May 2024</text><text x="560" y="84" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Budgets thaw when a board-level deadline forces them to.</text><text x="560" y="46" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="27" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">The dated catalysts an egoist works backwards from</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580"><g transform="translate(560,290)"><rect x="-560" y="-290" width="1120" height="580" fill="#F7F5EF"/></g><g transform="translate(880,322)"><rect x="-150" y="-210" width="300" height="420" rx="14" fill="#E4EBE5"/></g><g transform="translate(560,468)"><rect x="-450" y="-0.5" width="900" height="1" fill="#D8D3C7"/></g><text x="880" y="498" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">Mutual action plan</text><text x="560" y="498" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">wants price and terms</text><text x="240" y="498" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Procurement</text><g transform="translate(560,410)"><rect x="-450" y="-0.5" width="900" height="1" fill="#D8D3C7"/></g><text x="880" y="440" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">Governance narrative</text><text x="560" y="440" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">wants explainability</text><text x="240" y="440" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Compliance</text><g transform="translate(560,352)"><rect x="-450" y="-0.5" width="900" height="1" fill="#D8D3C7"/></g><text x="880" y="382" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">Trust plus regulatory case</text><text x="560" y="382" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">wants real-time risk</text><text x="240" y="382" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">The CRO</text><g transform="translate(560,294)"><rect x="-450" y="-0.5" width="900" height="1" fill="#D8D3C7"/></g><text x="880" y="324" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">Strangler-gateway story</text><text x="560" y="324" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">wants resilience, no lock-in</text><text x="240" y="324" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Head of Architecture</text><g transform="translate(560,236)"><rect x="-450" y="-0.5" width="900" height="1" fill="#D8D3C7"/></g><text x="880" y="266" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">A working demo</text><text x="560" y="266" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">wants elegant data access</text><text x="240" y="266" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">The quant</text><text x="880" y="208" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">Challenger insight</text><text x="560" y="208" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">wants speed</text><text x="240" y="208" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Head of Trading</text><text x="880" y="146" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="1.4" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">WHAT MOVES THEM</text><text x="560" y="146" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="1.4" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">WHAT THEY WANT</text><text x="240" y="146" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="1.4" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">THE SEAT</text><text x="560" y="84" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">No single message satisfies all of them. The wrong weapon is a disqualification.</text><text x="560" y="46" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="27" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">One committee, six appetites, six weapons</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" width="1400" height="500"><g transform="translate(700,250)"><rect x="-700" y="-250" width="1400" height="500" fill="#F7F5EF"/></g><text x="700" y="462" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">That is the Bruntsfield playbook: a closed loop from conviction to ownership.</text><g transform="translate(1240,224)"><rect x="-150" y="-84" width="300" height="168" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(890,224)"><rect x="-150" y="-84" width="300" height="168" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(540,224)"><rect x="-150" y="-84" width="300" height="168" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(190,224)"><rect x="-150" y="-84" width="300" height="168" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(700,394)"><rect x="-600" y="-27" width="1200" height="54" rx="14" fill="#1A3B26"/></g><text x="700" y="394" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" letter-spacing="1.3" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">VIII . TOTAL ACCOUNT AWARENESS RUNS THE WHOLE WAY THROUGH</text><g transform="translate(1048,224)"><rect x="-11.5" y="-1.25" width="23" height="2.5" fill="#6E6A60"/></g><g transform="translate(1064,224) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(698,224)"><rect x="-11.5" y="-1.25" width="23" height="2.5" fill="#6E6A60"/></g><g transform="translate(714,224) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(348,224)"><rect x="-11.5" y="-1.25" width="23" height="2.5" fill="#6E6A60"/></g><g transform="translate(364,224) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><text x="1240" y="252" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">before an RFP exists</text><text x="1240" y="226" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Pre-emptive strike (VIII)</text><text x="1240" y="172" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" letter-spacing="1.3" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">THE CLOSE</text><text x="890" y="252" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Drop the script (VII)</text><text x="890" y="226" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Orchestrate the committee (V)</text><text x="890" y="172" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" letter-spacing="1.3" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">THE ENGAGEMENT</text><text x="540" y="252" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Seek the hardest room (IV)</text><text x="540" y="226" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Run the documented play (III)</text><text x="540" y="172" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" letter-spacing="1.3" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">THE TRIGGER</text><text x="190" y="278" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Be present early (VI)</text><text x="190" y="252" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Enter with one weapon (II)</text><text x="190" y="226" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Choose the hard account (I)</text><text x="190" y="172" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" letter-spacing="1.3" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">BEFORE</text><text x="700" y="84" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">They are not eight skills practised apart. Run end to end they look like this.</text><text x="700" y="46" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="28" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Eight convictions, one campaign</text></svg>

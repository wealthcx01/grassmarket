<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 660" width="1400" height="660"><g transform="translate(700,330)"><rect x="-700" y="-330" width="1400" height="660" fill="#F7F5EF"/></g><g transform="translate(720,350)"><rect x="-540" y="-210" width="1080" height="420" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(720,380)"><rect x="-170" y="-65" width="340" height="130" rx="14" fill="#E4EBE5"/></g><text x="1046" y="520" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">to your best seller.</text><text x="1046" y="496" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">The trivial renewal given</text><text x="1046" y="458" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="20" letter-spacing="1.4" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">BOREDOM</text><text x="720" y="412" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">with one demanding goal.</text><text x="720" y="388" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Difficulty matched to the seller,</text><text x="720" y="352" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="22" letter-spacing="1.6" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">FLOW</text><text x="396" y="292" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Fear drives over-discounting.</text><text x="396" y="268" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">you sent a junior into.</text><text x="396" y="244" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">The Tier-1 procurement battle</text><text x="396" y="206" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="20" letter-spacing="1.4" fill="#A3502A" text-anchor="middle" dominant-baseline="central">ANXIETY</text><text x="720" y="596" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="1.4" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">SKILL</text><text x="96" y="350" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="1.4" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">CHALLENGE</text><text x="700" y="84" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Peak performance sits where challenge meets skill. It is engineered, not awaited.</text><text x="700" y="46" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="27" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Boredom, flow, anxiety: calibrate the room</text></svg>

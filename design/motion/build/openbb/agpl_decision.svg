<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640"><g transform="translate(560,320)"><rect x="-560" y="-320" width="1120" height="640" fill="#F7F5EF"/></g><g transform="translate(930,424)"><rect x="-1.25" y="-13.5" width="2.5" height="27" fill="#6E6A60"/></g><g transform="translate(930,442) rotate(180)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(630,424)"><rect x="-1.25" y="-13.5" width="2.5" height="27" fill="#6E6A60"/></g><g transform="translate(630,442) rotate(180)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(780,396)"><rect x="-150" y="-1.25" width="300" height="2.5" fill="#6E6A60"/></g><g transform="translate(780,382)"><rect x="-1.25" y="-13" width="2.5" height="26" fill="#6E6A60"/></g><g transform="translate(905,252)"><rect x="-1.25" y="-14.5" width="2.5" height="29" fill="#6E6A60"/></g><g transform="translate(905,271) rotate(180)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(215,252)"><rect x="-1.25" y="-17.5" width="2.5" height="35" fill="#6E6A60"/></g><g transform="translate(215,274) rotate(180)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(560,226)"><rect x="-345" y="-1.25" width="690" height="2.5" fill="#6E6A60"/></g><g transform="translate(560,208)"><rect x="-1.25" y="-17" width="2.5" height="34" fill="#6E6A60"/></g><g transform="translate(940,508)"><rect x="-145" y="-59" width="290" height="118" rx="14" fill="#1A3B26"/></g><g transform="translate(640,508)"><rect x="-135" y="-59" width="270" height="118" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(200,336)"><rect x="-160" y="-59" width="320" height="118" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(780,324)"><rect x="-210" y="-40" width="420" height="80" rx="14" fill="#F7F5EF" stroke="#1A1A18" stroke-width="2"/></g><g transform="translate(560,158)"><rect x="-235" y="-29" width="470" height="58" rx="14" fill="#F7F5EF" stroke="#1A1A18" stroke-width="2"/></g><text x="560" y="602" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#A3502A" text-anchor="middle" dominant-baseline="central">Name the licence. Say the commercial route exists. Never advise on it yourself.</text><text x="940" y="530" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">arrangement is for.</text><text x="940" y="510" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">This is what a commercial</text><text x="940" y="480" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">Source disclosure bites</text><text x="640" y="530" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">clause is not triggered.</text><text x="640" y="510" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Modify freely. The network</text><text x="640" y="480" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">Internal use only</text><text x="952" y="402" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Yes</text><text x="616" y="402" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">No</text><text x="780" y="338" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="18" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">over a network?</text><text x="780" y="312" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="18" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Are they SERVING it to others</text><text x="200" y="360" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">publish anything.</text><text x="200" y="338" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">No AGPL obligation to</text><text x="200" y="306" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="18" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">Using it as published</text><text x="890" y="218" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Yes</text><text x="214" y="218" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">No</text><text x="560" y="158" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="20" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Are they MODIFYING the platform?</text><text x="560" y="82" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">The Open Data Platform is AGPLv3. Two questions decide the answer.</text><text x="560" y="46" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="28" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Can the client build on the open-source platform?</text></svg>

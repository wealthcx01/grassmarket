<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500"><g transform="translate(480,250)"><rect x="-480" y="-250" width="960" height="500" fill="#F7F5EF"/></g><g transform="translate(545,248)"><rect x="-25.5" y="-1.25" width="51" height="2.5" fill="#1A3B26"/></g><g transform="translate(575,248) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#1A3B26"/></g><g transform="translate(730,276)"><rect x="-150" y="-54" width="300" height="108" rx="14" fill="#1A3B26"/></g><g transform="translate(300,388)"><rect x="-235" y="-29" width="470" height="58" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(300,318)"><rect x="-235" y="-29" width="470" height="58" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(300,248)"><rect x="-235" y="-29" width="470" height="58" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(300,178)"><rect x="-235" y="-29" width="470" height="58" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><text x="730" y="300" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">where a number came from.</text><text x="730" y="278" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">when compliance asks</text><text x="730" y="250" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">This is your answer</text><text x="300" y="403" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">the interactive part: ticker, date range</text><text x="300" y="377" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Parameters</text><text x="300" y="333" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">table, chart, PDF, or a custom view</text><text x="300" y="307" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Visual layer</text><text x="300" y="263" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">title, category, and the source attribution</text><text x="300" y="237" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Metadata layer</text><text x="300" y="193" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">a feed, a database, their own data, a static file</text><text x="300" y="167" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Data source</text><text x="480" y="78" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">OpenBB calls it a data container built to answer one analytical question.</text><text x="480" y="44" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="30" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">What a widget is made of</text></svg>

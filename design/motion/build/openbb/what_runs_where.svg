<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420"><g transform="translate(480,210)"><rect x="-480" y="-210" width="960" height="420" fill="#F7F5EF"/></g><g transform="translate(704,220)"><rect x="-170" y="-105" width="340" height="210" rx="14" fill="#1A3B26"/></g><g transform="translate(256,220)"><rect x="-170" y="-105" width="340" height="210" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><text x="480" y="372" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">You install the left-hand box. The client pays for the right-hand one.</text><g transform="translate(480,244)"><rect x="-55.5" y="-1.25" width="111" height="2.5" fill="#6E6A60"/></g><g transform="translate(540,244) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><text x="480" y="218" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">talks to</text><text x="704" y="286" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">product</text><text x="704" y="258" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">this is the commercial</text><text x="704" y="210" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#7FD4A0" text-anchor="middle" dominant-baseline="central">pro.openbb.co</text><text x="704" y="178" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">OpenBB Workspace</text><text x="704" y="140" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="20" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">Their browser</text><text x="256" y="286" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">localhost:6900</text><text x="256" y="258" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">platform API</text><text x="256" y="210" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">pip install openbb</text><text x="256" y="178" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">the open-source package</text><text x="256" y="140" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="20" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Your machine</text><text x="480" y="80" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Two different things, on two different machines.</text><text x="480" y="46" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="28" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">What you install, and what a client buys</text></svg>

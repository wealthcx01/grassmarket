<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420"><g transform="translate(480,210)"><rect x="-480" y="-210" width="960" height="420" fill="#F7F5EF"/></g><text x="480" y="368" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Sharing is the commercial hinge. Most business cases lean on it, not on a widget.</text><g transform="translate(792,240)"><rect x="-134" y="-65" width="268" height="130" rx="14" fill="#1A3B26"/></g><g transform="translate(480,240)"><rect x="-134" y="-65" width="268" height="130" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(168,240)"><rect x="-134" y="-65" width="268" height="130" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(636,240)"><rect x="-15.5" y="-1.25" width="31" height="2.5" fill="#6E6A60"/></g><g transform="translate(656,240) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(324,240)"><rect x="-15.5" y="-1.25" width="31" height="2.5" fill="#6E6A60"/></g><g transform="translate(344,240) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><text x="792" y="258" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">curated widgets, an agent, prompts</text><text x="792" y="226" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="20" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">App</text><text x="480" y="258" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">the configuration, as a file</text><text x="480" y="226" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="20" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Export apps.json</text><text x="168" y="258" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">you configured a blank canvas</text><text x="168" y="226" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="20" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Dashboard</text><text x="480" y="78" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">One person's work becomes everyone's, without rebuilding it.</text><text x="480" y="44" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="28" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">From your dashboard to the desk's standard</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500"><g transform="translate(500,250)"><rect x="-500" y="-250" width="1000" height="500" fill="#F7F5EF"/></g><text x="500" y="452" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">A generic logo API takes a domain. That is the wrong key for a holdings table.</text><g transform="translate(745,259)"><rect x="-165" y="-75" width="330" height="150" rx="14" fill="#1A3B26"/></g><text x="745" y="296" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">firmographics</text><text x="745" y="272" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">colours and fonts</text><text x="745" y="248" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">logo in every variant</text><text x="745" y="210" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="20" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">One brand identity</text><g transform="translate(425,370)"><rect x="-40.5" y="-1.25" width="81" height="2.5" fill="#6E6A60"/></g><g transform="translate(470,370) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(190,370)"><rect x="-150" y="-31" width="300" height="62" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><text x="190" y="382" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="13" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">BTC</text><text x="190" y="360" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">a crypto symbol</text><g transform="translate(425,296)"><rect x="-40.5" y="-1.25" width="81" height="2.5" fill="#6E6A60"/></g><g transform="translate(470,296) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(190,296)"><rect x="-150" y="-31" width="300" height="62" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><text x="190" y="308" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="13" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">US6541061031</text><text x="190" y="286" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">an ISIN</text><g transform="translate(425,222)"><rect x="-40.5" y="-1.25" width="81" height="2.5" fill="#6E6A60"/></g><g transform="translate(470,222) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(190,222)"><rect x="-150" y="-31" width="300" height="62" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><text x="190" y="234" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="13" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">NKE</text><text x="190" y="212" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">a stock ticker</text><g transform="translate(425,148)"><rect x="-40.5" y="-1.25" width="81" height="2.5" fill="#6E6A60"/></g><g transform="translate(470,148) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(190,148)"><rect x="-150" y="-31" width="300" height="62" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><text x="190" y="160" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="13" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">nike.com</text><text x="190" y="138" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">a domain</text><text x="500" y="78" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Your client's records are keyed by ticker or ISIN, not by domain.</text><text x="500" y="44" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="30" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Four keys, one endpoint</text></svg>

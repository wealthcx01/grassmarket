<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440"><g transform="translate(490,220)"><rect x="-490" y="-220" width="980" height="440" fill="#F7F5EF"/></g><text x="490" y="398" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#A3502A" text-anchor="middle" dominant-baseline="central">That arrow is the licence question. It is why this tier exists.</text><g transform="translate(800,225)"><rect x="-130" y="-80" width="260" height="160" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><text x="800" y="264" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">their building</text><text x="800" y="240" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">the data leaves</text><text x="800" y="200" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Their customers</text><g transform="translate(560,225)"><rect x="-60.5" y="-1.25" width="121" height="2.5" fill="#1A3B26"/></g><g transform="translate(625,225) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#1A3B26"/></g><g transform="translate(250,225)"><rect x="-180" y="-110" width="360" height="220" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(250,282)"><rect x="-160" y="-16" width="320" height="32" rx="6" fill="#1A3B26"/></g><text x="250" y="282" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">brand identity</text><text x="250" y="244" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">SEDOL, MIC, currency</text><text x="250" y="206" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">legal name</text><text x="250" y="168" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">ISIN</text><text x="250" y="128" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1.2" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">THEIR REFERENCE RECORD</text><text x="490" y="78" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">An exchange or vendor redistributes reference data every day.</text><text x="490" y="44" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="30" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">One more field on a record they already ship</text></svg>

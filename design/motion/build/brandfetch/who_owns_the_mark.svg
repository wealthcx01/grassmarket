<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440"><g transform="translate(500,220)"><rect x="-500" y="-220" width="1000" height="440" fill="#F7F5EF"/></g><text x="500" y="396" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Say this before the compliance officer asks. It stays a short conversation.</text><text x="500" y="348" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="18" fill="#A3502A" text-anchor="middle" dominant-baseline="central">Paying for access does not transfer anybody's rights.</text><g transform="translate(820,212)"><rect x="-130" y="-85" width="260" height="170" rx="14" fill="#1A3B26"/></g><g transform="translate(500,212)"><rect x="-130" y="-85" width="260" height="170" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(180,212)"><rect x="-130" y="-85" width="260" height="170" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(660,212)"><rect x="-45.5" y="-1.25" width="91" height="2.5" fill="#6E6A60"/></g><g transform="translate(710,212) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(340,212)"><rect x="-45.5" y="-1.25" width="91" height="2.5" fill="#6E6A60"/></g><g transform="translate(390,212) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><text x="820" y="248" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">fair-use risk</text><text x="820" y="224" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">carries the</text><text x="820" y="178" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="18" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">Your client</text><text x="500" y="248" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">to it</text><text x="500" y="224" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">provides access</text><text x="500" y="178" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="18" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Brandfetch</text><text x="180" y="246" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">owns the mark</text><text x="180" y="202" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="18" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">owner</text><text x="180" y="178" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="18" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">The trademark</text><text x="500" y="46" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="30" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Three parties, and the risk is not where they think</text></svg>

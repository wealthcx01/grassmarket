<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440"><g transform="translate(480,220)"><rect x="-480" y="-220" width="960" height="440" fill="#F7F5EF"/></g><text x="480" y="398" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">A scraper has no one maintaining it. That is the whole argument.</text><g transform="translate(730,240)"><rect x="-190" y="-100" width="380" height="200" rx="14" fill="#1A3B26"/></g><g transform="translate(230,240)"><rect x="-190" y="-100" width="380" height="200" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(480,240)"><rect x="-55.5" y="-1.25" width="111" height="2.5" fill="#6E6A60"/></g><g transform="translate(540,240) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><text x="730" y="274" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#7FD4A0" text-anchor="middle" dominant-baseline="central">this is what you sell</text><text x="730" y="234" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">brand identity out</text><text x="730" y="210" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">one identifier in,</text><text x="730" y="168" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="21" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">The developer API</text><text x="230" y="298" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">firmographics</text><text x="230" y="274" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">logos, colours, fonts,</text><text x="230" y="234" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">profile and verifies it</text><text x="230" y="210" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">a company claims its own</text><text x="230" y="168" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="21" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">The public registry</text><text x="480" y="80" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">The brands maintain it. That is why the data is current.</text><text x="480" y="46" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="30" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">One registry, two sides</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" width="1180" height="500"><g transform="translate(590,250)"><rect x="-590" y="-250" width="1180" height="500" fill="#F7F5EF"/></g><text x="660" y="462" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#A3502A" text-anchor="middle" dominant-baseline="central">The line is not publicly bright-lined. Never decide it yourself.</text><g transform="translate(660,288)"><rect x="-1" y="-150" width="2" height="300" fill="#1A1A18"/></g><g transform="translate(420,288)"><rect x="-210" y="-130" width="420" height="260" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(900,288)"><rect x="-210" y="-130" width="420" height="260" rx="14" fill="#1A3B26"/></g><text x="108" y="366" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1.2" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">WHO BUYS IT</text><text x="108" y="288" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1.2" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">WHAT LICENCE</text><text x="108" y="210" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1.2" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">WHERE THE DATA GOES</text><text x="900" y="377" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">information vendors</text><text x="900" y="355" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">Exchanges and</text><text x="420" y="355" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Retail brokerages</text><text x="900" y="299" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">licensing only</text><text x="900" y="277" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">Enterprise custom</text><text x="420" y="299" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">self-serve</text><text x="420" y="277" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Standard paid API,</text><text x="900" y="221" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">customers</text><text x="900" y="199" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">Passed on to their</text><text x="420" y="221" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">own product</text><text x="420" y="199" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Shown inside their</text><text x="900" y="138" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="18" letter-spacing="1.4" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">REDISTRIBUTION</text><text x="420" y="138" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="18" letter-spacing="1.4" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">DISTRIBUTION</text><text x="660" y="46" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="30" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">One boundary deci
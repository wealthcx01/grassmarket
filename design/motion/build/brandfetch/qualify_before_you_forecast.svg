<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420"><g transform="translate(500,210)"><rect x="-500" y="-210" width="1000" height="420" fill="#F7F5EF"/></g><text x="500" y="390" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Never from memory, and never from a slide: the schedule is the only source.</text><text x="500" y="348" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">Different rate, different window. Read yours off the Earnings page.</text><g transform="translate(730,176)"><rect x="-1.25" y="-13.5" width="2.5" height="27" fill="#6E6A60"/></g><g transform="translate(730,194) rotate(180)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(270,176)"><rect x="-1.25" y="-13.5" width="2.5" height="27" fill="#6E6A60"/></g><g transform="translate(270,194) rotate(180)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(730,262)"><rect x="-150" y="-50" width="300" height="100" rx="14" fill="#1A3B26"/></g><g transform="translate(270,262)"><rect x="-150" y="-50" width="300" height="100" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><text x="730" y="278" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">enterprise licensing</text><text x="730" y="246" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">Redistribution</text><text x="270" y="278" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">standard paid API</text><text x="270" y="246" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Distribution</text><text x="700" y="186" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Yes</text><text x="300" y="186" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">No</text><g transform="translate(500,130)"><rect x="-280" y="-29" width="560" height="58" rx="14" fill="#F7F5EF" stroke="#1A1A18" stroke-width="2"/></g><text x="500" y="130" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="21" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Does the data leave the client's own product?</text><text x="500" y="46" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="30" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Qualify the licence before you forecast</text></svg>

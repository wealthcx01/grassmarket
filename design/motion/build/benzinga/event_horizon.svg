<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390"><g transform="translate(450,195)"><rect x="-450" y="-195" width="900" height="390" fill="#F7F5EF"/></g><text x="450" y="350" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">A platform with no forward calendar is a rear-view mirror.</text><text x="796" y="302" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">forward</text><text x="104" y="302" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">today</text><g transform="translate(450,272)"><rect x="-350" y="-1" width="700" height="2" fill="#6E6A60"/></g><g transform="translate(660,253)"><rect x="-1" y="-19" width="2" height="38" fill="#6E6A60"/></g><g transform="translate(660,190)"><rect x="-75" y="-37" width="150" height="74" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><text x="660" y="204" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">in 90 days</text><text x="660" y="178" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">lockup expiry</text><g transform="translate(490,253)"><rect x="-1" y="-19" width="2" height="38" fill="#6E6A60"/></g><g transform="translate(490,190)"><rect x="-75" y="-37" width="150" height="74" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><text x="490" y="204" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">in 2 weeks</text><text x="490" y="178" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">PDUFA date</text><g transform="translate(320,253)"><rect x="-1" y="-19" width="2" height="38" fill="#6E6A60"/></g><g transform="translate(320,190)"><rect x="-75" y="-37" width="150" height="74" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><text x="320" y="204" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">in 3 days</text><text x="320" y="178" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">ex-dividend</text><g transform="translate(150,253)"><rect x="-1" y="-19" width="2" height="38" fill="#6E6A60"/></g><g transform="translate(150,190)"><rect x="-75" y="-37" width="150" height="74" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><text x="150" y="204" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">tomorrow</text><text x="150" y="178" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">earnings</text><text x="450" y="78" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Every other family says what happened. These say what is about to.</text><text x="450" y="44" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="30" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">The calendars sell a tense</text></svg>

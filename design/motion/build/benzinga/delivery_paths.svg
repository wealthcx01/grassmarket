<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500"><g transform="translate(480,250)"><rect x="-480" y="-250" width="960" height="500" fill="#F7F5EF"/></g><text x="480" y="468" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#A3502A" text-anchor="middle" dominant-baseline="central">Ask which one they can consume before you promise a timeline.</text><g transform="translate(480,438)"><rect x="-350" y="-0.5" width="700" height="1" fill="#D8D3C7"/></g><g transform="translate(468,372)"><rect x="-120.5" y="-1.25" width="241" height="2.5" fill="#6E6A60"/></g><g transform="translate(593,372) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(176,372)"><rect x="-140" y="-39" width="280" height="78" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><text x="720" y="372" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">somewhere to put it</text><text x="176" y="386" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">a file lands, in buckets</text><text x="176" y="358" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">FTP / S3</text><g transform="translate(468,270)"><rect x="-120.5" y="-1.25" width="241" height="2.5" fill="#6E6A60"/></g><g transform="translate(593,270) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(176,270)"><rect x="-140" y="-39" width="280" height="78" rx="14" fill="#1A3B26" stroke="#D8D3C7" stroke-width="2"/></g><text x="720" y="270" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">an always-on consumer</text><text x="176" y="284" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">it arrives, as it happens</text><text x="176" y="256" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">TCP (push)</text><g transform="translate(468,168)"><rect x="-120.5" y="-1.25" width="241" height="2.5" fill="#6E6A60"/></g><g transform="translate(593,168) rotate(90)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(176,168)"><rect x="-140" y="-39" width="280" height="78" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><text x="720" y="168" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">a scheduled job</text><text x="176" y="182" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">you ask, on your schedule</text><text x="176" y="154" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">REST (pull)</text><text x="720" y="116" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="1.4" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">CLIENT MUST HAVE</text><text x="176" y="116" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="1.4" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">BENZINGA OFFERS</text><text x="480" y="78" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Three delivery methods. Each one is a different build for the client.</text><text x="480" y="44" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="30" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">How the data actually arrives</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450"><g transform="translate(500,225)"><rect x="-500" y="-225" width="1000" height="450" fill="#F7F5EF"/></g><text x="500" y="408" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">The workshop IS the demo. Book it off a pain you actually heard.</text><g transform="translate(730,244)"><rect x="-190" y="-110" width="380" height="220" rx="14" fill="#E4EBE5" stroke="#1A3B26" stroke-width="2"/></g><g transform="translate(270,244)"><rect x="-190" y="-110" width="380" height="220" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><text x="730" y="316" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">a finding, and a date</text><text x="730" y="268" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">in ninety minutes</text><text x="730" y="244" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">on their own numbers,</text><text x="730" y="196" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">moat get scored</text><text x="730" y="172" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">they watch their own</text><text x="270" y="316" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#A3502A" text-anchor="middle" dominant-baseline="central">no dated next step</text><text x="270" y="268" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">interesting</text><text x="270" y="244" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">they say it sounds</text><text x="270" y="196" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">methodology</text><text x="270" y="172" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">you describe the</text><text x="730" y="112" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">AN ADVANCING ACTION</text><text x="270" y="112" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">A COURTESY CALL</text><text x="500" y="46" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="30" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Two meetings, one calendar entry</text></svg>

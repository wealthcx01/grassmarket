<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="1020" height="560"><g transform="translate(510,280)"><rect x="-510" y="-280" width="1020" height="560" fill="#F7F5EF"/></g><text x="510" y="522" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Self-sourced always pays more. Read the live cell off the Earnings page.</text><text x="510" y="330" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">delivery type  x  sourcing  sets the Stream B rate</text><g transform="translate(830,460)"><rect x="-90" y="-20" width="180" height="40" rx="8" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><text x="830" y="460" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">rate</text><g transform="translate(620,460)"><rect x="-90" y="-20" width="180" height="40" rx="8" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><text x="620" y="460" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">rate</text><g transform="translate(830,412)"><rect x="-90" y="-20" width="180" height="40" rx="8" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><text x="830" y="412" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">rate</text><g transform="translate(620,412)"><rect x="-90" y="-20" width="180" height="40" rx="8" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><text x="620" y="412" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">rate</text><text x="830" y="372" font-family="Inter, system-ui, sans-serif" font-weight="700" font-siz
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 460" width="1020" height="460"><g transform="translate(510,230)"><rect x="-510" y="-230" width="1020" height="460" fill="#F7F5EF"/></g><text x="510" y="424" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">A scored moat that was not ready today is a warm lead in two quarters.</text><text x="510" y="382" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#A3502A" text-anchor="middle" dominant-baseline="central">Written off is the default. It is what happens when nobody does anything.</text><g transform="translate(720,164)"><rect x="-1.25" y="-15.5" width="2.5" height="31" fill="#6E6A60"/></g><g transform="translate(720,184) rotate(180)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(280,164)"><rect x="-1.25" y="-15.5" width="2.5" height="31" fill="#6E6A60"/></g><g transform="translate(280,184) rotate(180)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(740,272)"><rect x="-170" y="-60" width="340" height="120" rx="14" fill="#1A3B26"/></g><g transform="translate(280,272)"><rect x="-170" y="-60" width="340" height="120" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><text x="740" y="300" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">recovered, deal to Nurture</text><text x="740" y="278" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">the workshop effort is</text><text x="740" y="244" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">Recovery fee</text><text x="280" y="300" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">the lead goes cold</text><text x="280" y="278" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">the effort is gone and</text><text x="280" y="244" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="19" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Written off</text><text x="632" y="176" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">resolve it</text><text x="372" y="176" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">do nothing</text><g transform="translate(510,122)"><rect x="-220" y="-27" width="440" height="54" rx="14" fill="#F7F5EF" stroke="#1A1A18" stroke-width="2"/></g><text x="510" y="122" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="20" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">The attribution window closes.</text><text x="510" y="46" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="30" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">A workshop delivered, and no contract</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460"><g transform="translate(500,230)"><rect x="-500" y="-230" width="1000" height="460" fill="#F7F5EF"/></g><text x="500" y="418" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#A3502A" text-anchor="middle" dominant-baseline="central">Log who sourced it on day one. Nobody can reconstruct it in month nine.</text><text x="800" y="312" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">your rate later</text><text x="800" y="288" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">sourcing decides</text><text x="800" y="232" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">no reason to meet</text><text x="800" y="208" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">no pain,</text><g transform="translate(330,246)"><rect x="-230" y="-120" width="460" height="240" rx="14" fill="#F7F5EF" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(330,334)"><rect x="-200" y="-18" width="400" height="36" rx="6" fill="#1A3B26"/></g><text x="330" y="334" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">a dated next step</text><g transform="translate(330,290)"><rect x="-200" y="-18" width="400" height="36" rx="6" fill="#1A3B26"/></g><text x="330" y="290" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">who sourced it</text><g transform="translate(330,246)"><rect x="-200" y="-18" width="400" height="36" rx="6" fill="#1A3B26"/></g><text x="330" y="246" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">the growth pain, verbatim</text><text x="330" y="202" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">sector</text><text x="330" y="158" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">company and contact</text><text x="500" y="82" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Anyone fills in the top two. The bottom three are the deal.</text><text x="500" y="46" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="30" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">A prospect record, or a business card</text></svg>

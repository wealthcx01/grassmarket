<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460"><g transform="translate(500,230)"><rect x="-500" y="-230" width="1000" height="460" fill="#F7F5EF"/></g><text x="500" y="424" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">"It went well" is not a qualification. A named bottleneck is.</text><text x="500" y="382" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="17" fill="#A3502A" text-anchor="middle" dominant-baseline="central">Left at Delivered is not a third answer. It is nobody having decided.</text><g transform="translate(730,172)"><rect x="-1.25" y="-15.5" width="2.5" height="31" fill="#6E6A60"/></g><g transform="translate(730,192) rotate(180)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(270,172)"><rect x="-1.25" y="-15.5" width="2.5" height="31" fill="#6E6A60"/></g><g transform="translate(270,192) rotate(180)"><polygon points="0,-7.2 7.2,7.2 -7.2,7.2" fill="#6E6A60"/></g><g transform="translate(730,276)"><rect x="-160" y="-58" width="320" height="116" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(270,276)"><rect x="-160" y="-58" width="320" height="116" rx="14" fill="#1A3B26"/></g><text x="730" y="304" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">a dated reason to return</text><text x="730" y="282" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">say so honestly, with</text><text x="730" y="248" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="20" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Nurture</text><text x="270" y="304" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">finding recorded</text><text x="270" y="282" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#B9C7BC" text-anchor="middle" dominant-baseline="central">advance, with the</text><text x="270" y="248" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="20" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">Qualified</text><text x="700" y="184" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">No</text><text x="300" y="184" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">Yes</text><g transform="translate(500,128)"><rect x="-270" y="-29" width="540" height="58" rx="14" fill="#F7F5EF" stroke="#1A1A18" stroke-width="2"/></g><text x="500" y="128" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="21" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Is there a real, addressable bottleneck?</text><text x="500" y="46" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="30" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Every workshop ends in one of two states</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 480" width="1180" height="480"><g transform="translate(590,240)"><rect x="-590" y="-240" width="1180" height="480" fill="#F7F5EF"/></g><text x="590" y="440" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#A3502A" text-anchor="middle" dominant-baseline="central">Dividing a score into pounds invents a number the methodology refuses to produce.</text><text x="590" y="396" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">never one equation</text><g transform="translate(590,254)"><rect x="-2" y="-135" width="4" height="270" fill="#1A1A18"/></g><g transform="translate(320,254)"><rect x="-220" y="-115" width="440" height="230" rx="14" fill="#E4EBE5" stroke="#D8D3C7" stroke-width="2"/></g><g transform="translate(860,254)"><rect x="-220" y="-115" width="440" height="230" rx="14" fill="#1A3B26"/></g><text x="90" y="322" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1.2" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">ANSWERS</text><text x="90" y="254" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1.2" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">UNIT</text><text x="90" y="186" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1.2" fill="#6E6A60" text-anchor="middle" dominant-baseline="central">MEASURES</text><text x="860" y="322" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">what is it worth doing?</text><text x="320" y="322" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">how bad is this?</text><text x="860" y="254" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">pounds, traceable to an assumption</text><text x="320" y="254" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">score points</text><text x="860" y="186" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#EDF2EE" text-anchor="middle" dominant-baseline="central">what fixing it is worth</text><text x="320" y="186" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">how weak the moat is</text><text x="860" y="130" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="18" letter-spacing="1.4" fill="#1A3B26" text-anchor="middle" dominant-baseline="central">THE VALUE BRIDGE</text><text x="320" y="130" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="18" letter-spacing="1.4" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">THE SCORE</text><text x="590" y="46" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="30" fill="#1A1A18" text-anchor="middle" dominant-baseline="central">Two numbers, and a wall between them</text></svg>
